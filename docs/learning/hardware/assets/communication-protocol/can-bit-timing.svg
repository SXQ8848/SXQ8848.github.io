<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc"><title id="title">CAN 位时序｜采样点在哪里</title><desc id="desc">示例：fCAN = 40 MHz，实际分频 P = 5，TQ = 125 ns</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1078" height="528" rx="16" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<text x="36" y="49" font-size="30" fill="#e2e8f0" text-anchor="start" font-weight="700">CAN 位时序｜采样点在哪里</text>
<text x="36" y="83" font-size="20" fill="#a6b4c8" text-anchor="start" font-weight="400">示例：fCAN = 40 MHz，实际分频 P = 5，TQ = 125 ns</text>
<rect x="160" y="155" width="50" height="95" rx="0" fill="#29436a" stroke="#93c5fd" stroke-width="2"/>
<rect x="210" y="155" width="650" height="95" rx="0" fill="#163a40" stroke="#67e8f9" stroke-width="2"/>
<rect x="860" y="155" width="100" height="95" rx="0" fill="#52361d" stroke="#fdba74" stroke-width="2"/>
<text x="185" y="195" font-size="19" fill="#93c5fd" text-anchor="middle" font-weight="400">同步</text>
<text x="185" y="228" font-size="17" fill="#93c5fd" text-anchor="middle" font-weight="400">1 TQ</text>
<text x="535" y="194" font-size="23" fill="#67e8f9" text-anchor="middle" font-weight="400">TSEG1 = PROP_SEG + PHASE_SEG1</text>
<text x="535" y="228" font-size="23" fill="#67e8f9" text-anchor="middle" font-weight="400">13 TQ</text>
<text x="910" y="194" font-size="21" fill="#fdba74" text-anchor="middle" font-weight="400">TSEG2</text>
<text x="910" y="228" font-size="21" fill="#fdba74" text-anchor="middle" font-weight="400">2 TQ</text>
<path d="M160,267 L160,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="160" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">0</text>
<path d="M210,267 L210,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="210" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">1</text>
<path d="M260,267 L260,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="260" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">2</text>
<path d="M310,267 L310,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="310" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">3</text>
<path d="M360,267 L360,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="360" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">4</text>
<path d="M410,267 L410,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="410" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">5</text>
<path d="M460,267 L460,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="460" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">6</text>
<path d="M510,267 L510,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="510" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">7</text>
<path d="M560,267 L560,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="560" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">8</text>
<path d="M610,267 L610,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="610" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">9</text>
<path d="M660,267 L660,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="660" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">10</text>
<path d="M710,267 L710,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="710" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">11</text>
<path d="M760,267 L760,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="760" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">12</text>
<path d="M810,267 L810,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="810" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">13</text>
<path d="M860,267 L860,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="860" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">14</text>
<path d="M910,267 L910,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="910" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">15</text>
<path d="M960,267 L960,282" stroke="#94a3b8" stroke-width="2" fill="none" />
<text x="960" y="309" font-size="18" fill="#a6b4c8" text-anchor="middle" font-weight="400">16</text>
<path d="M860,130 L860,325" stroke="#fda4af" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
<text x="860" y="120" font-size="22" fill="#fda4af" text-anchor="middle" font-weight="400">采样点</text>
<rect x="36" y="345" width="1008" height="140" rx="10" fill="#18263c" stroke="#334155" stroke-width="2"/>
<text x="62" y="383" font-size="25" fill="#e2e8f0" text-anchor="start" font-weight="400">位时间 = (1 + 13 + 2) × 125 ns = 2 μs → 500 kbit/s</text>
<text x="62" y="424" font-size="25" fill="#86efac" text-anchor="start" font-weight="400">采样点 = (1 + 13) / 16 = 87.5%</text>
<text x="62" y="461" font-size="21" fill="#a6b4c8" text-anchor="start" font-weight="400">SJW 限制重同步的调整幅度，不额外增加固定的位长度。</text>
</g></svg>