<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">经典 CAN 数据帧｜字段顺序与位数</title><desc id="desc">MSB 先发送 · 字段宽度不按位数缩放 · 此图不展开填充位</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="1" y="1" width="1078" height="598" rx="16" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<text x="36" y="49" font-size="30" fill="#e2e8f0" text-anchor="start" font-weight="700">经典 CAN 数据帧｜字段顺序与位数</text>
<text x="36" y="83" font-size="20" fill="#a6b4c8" text-anchor="start" font-weight="400">MSB 先发送 · 字段宽度不按位数缩放 · 此图不展开填充位</text>
<rect x="35" y="130" width="75" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="72.5" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">SOF</text>
<text x="72.5" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">1 bit</text>
<rect x="110" y="130" width="155" height="100" rx="3" fill="#18263c" stroke="#67e8f9" stroke-width="2"/>
<text x="187.5" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">仲裁域</text>
<text x="187.5" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">12 / 32</text>
<rect x="265" y="130" width="125" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="327.5" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">控制域</text>
<text x="327.5" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">6 bit</text>
<rect x="390" y="130" width="190" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="485" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">数据域</text>
<text x="485" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">0～64 bit</text>
<rect x="580" y="130" width="140" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="650" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">CRC 域</text>
<text x="650" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">15 + 1</text>
<rect x="720" y="130" width="125" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="782.5" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">ACK 域</text>
<text x="782.5" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">1 + 1</text>
<rect x="845" y="130" width="85" height="100" rx="3" fill="#18263c" stroke="#475569" stroke-width="2"/>
<text x="887.5" y="166" font-size="21" fill="#e2e8f0" text-anchor="middle" font-weight="700">EOF</text>
<text x="887.5" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">7 bit</text>
<rect x="930" y="130" width="90" height="100" rx="3" fill="#263449" stroke="#475569" stroke-width="2"/>
<text x="975" y="166" font-size="21" fill="#a6b4c8" text-anchor="middle" font-weight="700">间歇</text>
<text x="975" y="203" font-size="20" fill="#a6b4c8" text-anchor="middle" font-weight="400">≥3 bit</text>
<text x="36" y="275" font-size="24" fill="#67e8f9" text-anchor="start" font-weight="700">标准格式</text>
<text x="215" y="275" font-size="21" fill="#e2e8f0" text-anchor="start" font-weight="400">仲裁域：ID 11 位 + RTR    ｜    控制域：IDE + r0 + DLC 4 位</text>
<text x="36" y="325" font-size="24" fill="#67e8f9" text-anchor="start" font-weight="700">扩展格式</text>
<text x="215" y="325" font-size="21" fill="#e2e8f0" text-anchor="start" font-weight="400">仲裁域：ID-A 11 + SRR + IDE + ID-B 18 + RTR = 32 位</text>
<text x="215" y="361" font-size="21" fill="#e2e8f0" text-anchor="start" font-weight="400">控制域：r1 + r0 + DLC 4 位 = 6 位</text>
<rect x="36" y="395" width="1008" height="111" rx="10" fill="#18263c" stroke="#334155" stroke-width="2"/>
<text x="60" y="432" font-size="22" fill="#86efac" text-anchor="start" font-weight="400">CRC 域 = CRC 序列 15 位 + 隐性分隔符 1 位</text>
<text x="60" y="474" font-size="21" fill="#fdba74" text-anchor="start" font-weight="400">ACK 域 = ACK 槽 1 位 + 隐性分隔符 1 位；发送者释放，接收者确认</text>
<text x="36" y="550" font-size="23" fill="#e2e8f0" text-anchor="start" font-weight="400">8 字节标准帧：108 bit 帧本体 + 3 bit 最小间歇 = 111 bit（未计填充）</text>
</g></svg>